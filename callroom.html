<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebRTC Call</title>

  <style>
    .call-room-area {
      background: #313338;
      color: #dbdee1;
      min-height: 100vh;
    }

    .room-container {
      width: min(900px, calc(100% - 32px));
      margin: 40px auto 120px auto;
    }

    .room-card {
      background: #2b2d31;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .room-title {
      margin: 0;
      color: #f2f3f5;
    }

    .room-id {
      color: #949ba4;
      font-size: 14px;
      margin-top: 4px;
    }

    .user-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(120px, 1fr));

      gap: 20px;
      margin-bottom: 30px;
    }

    .user {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .user-icon {
      width: 80px;
      height: 80px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #5865f2;
      color: white;

      font-size: 32px;
      font-weight: 700;
    }

    .user-icon.talking {
      animation: voiceRipple 0.8s infinite;
    }

    @keyframes voiceRipple {
      0% {
        box-shadow: 0 0 0 0 rgba(88, 101, 242, 0.8);
      }
      70% {
        box-shadow: 0 0 0 25px rgba(88, 101, 242, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(88, 101, 242, 0);
      }
    }

    .user-name {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
      color: #f2f3f5;
    }

    .empty-room {
      text-align: center;
      color: #949ba4;
      padding: 40px 0;
    }

    .call-card-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: #111214;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      z-index: 1000;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
    }

    .volume-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    #muteBtn {
      background: #2b2d31;
      color: #dbdee1;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      transition: background 0.2s;
    }

    #muteBtn:hover {
      background: #35373c;
    }

    .volume-popup {
      position: absolute;
      bottom: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b2d31;
      padding: 15px 10px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 1001;
    }

    .volume-popup.show {
      display: flex;
    }

    .volume-slider {
      writing-mode: vertical-lr;
      direction: rtl;
      height: 100px;
      accent-color: #5865f2;
      cursor: pointer;
    }

    #volumeBtn {
      background: #2b2d31;
      color: #dbdee1;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    #volumeBtn:hover {
      background: #35373c;
    }

    .leave-btn {
      background: #da373c;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      margin: 0;
      transition: opacity 0.2s;
    }

    .leave-btn:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="call-room-area">

    <div class="room-container">

      <div class="room-card">

        <div class="room-header">

          <div>
            <h1 class="room-title">
              通話ルーム
            </h1>

            <div
              id="roomIdDisplay"
              class="room-id"
            ></div>
          </div>

        </div>


        <div
          id="userGrid"
          class="user-grid"
        ></div>


        <div
          id="emptyRoom"
          class="empty-room"
        >
          参加者を待っています...
        </div>

      </div>

    </div>

    <div class="call-card-container">

      <div class="volume-box">
        <button
          id="muteBtn"
          onclick="RoomManager.toggleMute()"
          title="ミュート切り替え"
        >
          🔊
        </button>

        <div id="volumePopup" class="volume-popup">
          <input
            id="volumeSlider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
            class="volume-slider"
            oninput="RoomManager.changeVolume(this.value)"
            title="音量調整"
          >
        </div>
      </div>

      <button
        id="volumeBtn"
        onclick="toggleVolume()"
        title="音量設定"
      >
        🔽
      </button>

      <button
        class="leave-btn"
        onclick="RoomManager.leaveRoom()"
      >
        退出
      </button>

    </div>

  </div>

  <script>
    function toggleVolume() {
      const popup =
        document.getElementById(
          "volumePopup"
        );

      if (popup) {
        popup.classList.toggle(
          "show"
        );
      }
    }
  </script>

  <script type="module" src="roomJS.js"></script>

</body>
</html>
