<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebRTC Call</title>

  <style>
    .call-room-area {
      background: #313338;
      color: #dbdee1;
      min-height: 100vh;
    }

    .room-container {
      width: min(900px, calc(100% - 32px));
      margin: 40px auto 120px auto;
    }

    .room-card {
      background: #2b2d31;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .room-title {
      margin: 0;
      color: #f2f3f5;
    }

    .room-id {
      color: #949ba4;
      font-size: 14px;
      margin-top: 4px;
    }

    .user-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(120px, 1fr));

      gap: 20px;
      margin-bottom: 30px;
    }

    .user {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .user-icon {
      width: 80px;
      height: 80px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #5865f2;
      color: white;

      font-size: 32px;
      font-weight: 700;
    }

    .user-icon.talking {
      animation: voiceRipple 0.8s infinite;
    }

    @keyframes voiceRipple {
      0% {
        box-shadow: 0 0 0 0 rgba(88, 101, 242, 0.8);
      }
      70% {
        box-shadow: 0 0 0 25px rgba(88, 101, 242, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(88, 101, 242, 0);
      }
    }

    .user-name {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
      color: #f2f3f5;
    }

    .empty-room {
      text-align: center;
      color: #949ba4;
      padding: 40px 0;
    }
  </style>
</head>

<body>

  <div class="call-room-area">

    <div class="room-container">

      <div class="room-card">

        <div class="room-header">

          <div>
            <h1 class="room-title">
              通話ルーム
            </h1>

            <div
              id="roomIdDisplay"
              class="room-id"
            ></div>
          </div>

        </div>


        <div
          id="userGrid"
          class="user-grid"
        ></div>


        <div
          id="emptyRoom"
          class="empty-room"
        >
          参加者を待っています...
        </div>

      </div>

    </div>

    <div id="callCardContainer"></div>

  </div>

  <script>
    fetch('callroom-callcard.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('callCardContainer').innerHTML = html;
      });
  </script>

  <script type="module" src="roomJS.js"></script>

</body>
</html>
