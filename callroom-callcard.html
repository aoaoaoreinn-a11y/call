<style>
  .call-card-container {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 90px;
    background: #111214;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    z-index: 1000;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
  }

  .volume-box {
    position: relative;
    display: flex;
    align-items: center;
  }

  #muteBtn {
    background: #2b2d31;
    color: #dbdee1;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    transition: background 0.2s;
  }

  #muteBtn:hover {
    background: #35373c;
  }

  .volume-popup {
    position: absolute;
    bottom: 65px;
    left: 50%;
    transform: translateX(-50%);
    background: #2b2d31;
    padding: 15px 10px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    display: none;
    flex-direction: column;
    align-items: center;
    z-index: 1001;
  }

  .volume-popup.show {
    display: flex;
  }

  .volume-slider {
    writing-mode: vertical-lr;
    direction: rtl;
    height: 100px;
    accent-color: #5865f2;
    cursor: pointer;
  }

  #volumeBtn {
    background: #2b2d31;
    color: #dbdee1;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }

  #volumeBtn:hover {
    background: #35373c;
  }

  .leave-btn {
    background: #da373c;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: auto;
    margin: 0;
    transition: opacity 0.2s;
  }

  .leave-btn:hover {
    opacity: 0.85;
  }
</style>


<div class="call-card-container">

  <div class="volume-box">
    <button
      id="muteBtn"
      onclick="RoomManager.toggleMute()"
      title="ミュート切り替え"
    >
      🔊
    </button>

    <div id="volumePopup" class="volume-popup">
      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1"
        class="volume-slider"
        oninput="RoomManager.changeVolume(this.value)"
        title="音量調整"
      >
    </div>
  </div>

  <button
    id="volumeBtn"
    onclick="toggleVolume()"
    title="音量設定"
  >
    🔽
  </button>

  <button
    class="leave-btn"
    onclick="RoomManager.leaveRoom()"
  >
    退出
  </button>

</div>

<script>
  function toggleVolume() {
    const popup =
      document.getElementById(
        "volumePopup"
      );

    if (popup) {
      popup.classList.toggle(
        "show"
      );
    }
  }
</script>
