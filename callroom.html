<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebRTC Call</title>

  <style>
    .call-room-area {
      background: #313338;
      color: #dbdee1;
      min-height: 100vh;
    }

    .room-container {
      width: min(1100px, calc(100% - 32px));
      margin: 40px auto 120px auto;
    }

    .room-card {
      background: #2b2d31;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .room-title {
      margin: 0;
      color: #f2f3f5;
    }

    .room-id {
      color: #949ba4;
      font-size: 14px;
      margin-top: 4px;
    }

    .room-id span {
      color: #ffffff;
      text-decoration: underline;
      font-weight: 600;
    }

    .user-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-bottom: 30px;
    }

    .user {
      position: relative;
      width: 320px;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e1f22;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .video-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
      display: none;
    }

    .user.camera-active .video-box {
      display: block;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-icon {
      position: absolute;
      width: 160px;
      height: 160px;
      z-index: 2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5865f2;
      color: white;
      font-size: 64px;
      font-weight: 700;
      transition:
        transform 0.4s ease,
        width 0.4s ease,
        height 0.4s ease,
        font-size 0.4s ease;
    }

    .user.camera-active .user-icon {
      width: 55px;
      height: 55px;
      transform: translate(-110px, -70px);
      font-size: 22px;
    }

    .user-icon.talking {
      animation: voiceRipple 0.8s infinite;
    }

    @keyframes voiceRipple {
      0% {
        box-shadow: 0 0 0 0 var(--user-color, rgba(88, 101, 242, 0.8));
      }
      70% {
        box-shadow: 0 0 0 25px transparent;
      }
      100% {
        box-shadow: 0 0 0 0 transparent;
      }
    }

    .user-name {
      position: absolute;
      bottom: 12px;
      left: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
      color: #f2f3f5;
      z-index: 3;
    }

    .empty-room {
      text-align: center;
      color: #949ba4;
      padding: 40px 0;
    }
  </style>
</head>

<body>

  <div class="call-room-area">

    <div class="room-container">

      <div class="room-card">

        <div class="room-header">

          <div>
            <h1 class="room-title">
              通話ルーム
            </h1>

            <div
              id="roomIdDisplay"
              class="room-id"
            ></div>
          </div>

        </div>


        <div
          id="userGrid"
          class="user-grid"
        ></div>


        <div
          id="emptyRoom"
          class="empty-room"
        >
          参加者を待っています...
        </div>

      </div>

    </div>

    <!-- コントロールカード読み込み用プレースホルダー -->
    <div id="callCard"></div>

  </div>

  <script>
    window.toggleVolume = function() {
      const popup =
        document.getElementById("volumePopup");

      if (popup) {
        popup.classList.toggle("show");
      }
    };

    window.togglePanel = function() {
      const panel =
        document.getElementById("panelCard");

      if (panel) {
        panel.classList.toggle("show");
        if (panel.classList.contains("show")) {
          const badge =
            document.getElementById("chatBadge");

          if (badge) {
            badge.style.display = "none";
          }
        }
      }
    };

    window.pushData = function() {
      const input =
        document.getElementById("panelInput");

      if (!input) return;

      if (typeof RoomManager !== "undefined" && typeof RoomManager.pushData === "function") {
        RoomManager.pushData(input.value);
      }
      input.value = "";
    };

    fetch("callroom-callcard.html")
      .then(response => response.text())
      .then(html => {
        document.getElementById("callCard").innerHTML = html;
      })
      .catch(err => {
        console.error("callroom-callcard.htmlの読み込みに失敗しました:", err);
      });
  </script>

  <script type="module" src="roomJS.js"></script>

</body>
</html>
